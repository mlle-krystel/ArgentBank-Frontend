swagger: '2.0'
info:
  title: Bank Argent API documentation
  description: Contains all available API endpoints in this codebase
  version: '1.0.0'
  termsOfService: 'http://swagger.io/terms/'
host: localhost:3001
basePath: /api/v1
schemes:
  - http
consumes:
  - application/json
produces:
  - application/json

paths:
  /user/login:
    post:
      tags:
        - User Module
      summary: Login
      description: API for Login
      parameters:
        - in: body
          name: body
          description: Login Payload
          required: true
          schema:
            $ref: '#/definitions/Login'
      responses:
        '200':
          description: Login Successfully
          schema:
            $ref: '#/definitions/LoginResponse'
        '400':
          description: Invalid Fields
        '500':
          description: Internal Server Error

  /user/signup:
    post:
      tags:
        - User Module
      summary: Signup
      description: API for Signup
      parameters:
        - in: body
          name: body
          description: Signup Payload
          required: true
          schema:
            $ref: '#/definitions/User'
      responses:
        '200':
          description: Signup Successfully
          schema:
            $ref: '#/definitions/ApiResponse'
        '400':
          description: Invalid Fields
        '500':
          description: Internal Server Error

  /user/profile:
    get:
      security:
        - Bearer: []
      tags:
        - User Module
      summary: Get user profile
      description: Get authenticated user profile
      responses:
        '200':
          description: User profile retrieved
          schema:
            $ref: '#/definitions/UserProfile'
        '401':
          description: Unauthorized

# Transactions endpoints from phase 2
  /transactions:
    get:
      summary: Get all transactions for the current month
      description: Returns a list of all transactions grouped by account for the logged-in user.
      tags:
        - Transactions
      security:
        - Bearer: []
      responses:
        200:
          description: A list of transactions
          schema:
            type: array
            items:
              $ref: '#/definitions/Transaction'
        401:
          description: Unauthorized

  /transactions/{id}:
    get:
      summary: Get transaction details
      description: Returns detailed information about a specific transaction.
      tags:
        - Transactions
      security:
        - Bearer: []
      parameters:
        - name: id
          in: path
          required: true
          type: string
          description: The transaction ID
      responses:
        200:
          description: Transaction details
          schema:
            $ref: '#/definitions/Transaction'
        404:
          description: Transaction not found
        401:
          description: Unauthorized

    put:
      summary: Update transaction information
      description: Update editable information for a transaction.
      tags:
        - Transactions
      security:
        - Bearer: []
      parameters:
        - name: id
          in: path
          required: true
          type: string
        - in: body
          name: body
          required: true
          schema:
            $ref: '#/definitions/TransactionUpdate'
      responses:
        200:
          description: Transaction updated
        400:
          description: Invalid input
        404:
          description: Transaction not found

  /transactions/{id}/info:
    delete:
      summary: Delete additional transaction info
      description: Delete extra information attached to a transaction.
      tags:
        - Transactions
      security:
        - Bearer: []
      parameters:
        - name: id
          in: path
          required: true
          type: string
      responses:
        204:
          description: Info deleted
        404:
          description: Transaction not found

    post:
      summary: Add additional transaction info
      description: Add extra information (note, category, etc.) to a transaction.
      tags:
        - Transactions
      security:
        - Bearer: []
      parameters:
        - name: id
          in: path
          required: true
          type: string
        - in: body
          name: body
          required: true
          schema:
            $ref: '#/definitions/TransactionInfo'
      responses:
        201:
          description: Info added
        400:
          description: Invalid input
        404:
          description: Transaction not found

definitions:
  Login:
    type: object
    properties:
      email:
        type: string
      password:
        type: string

  LoginResponse:
    type: object
    properties:
      token:
        type: string

  User:
    type: object
    properties:
      email:
        type: string
      password:
        type: string
      userName:
        type: string

  ApiResponse:
    type: object
    properties:
      message:
        type: string

  UserProfile:
    type: object
    properties:
      id:
        type: string
      firstName:
        type: string
      lastName:
        type: string
      userName:
        type: string

  Transaction:
    type: object
    properties:
      id:
        type: string
      accountId:
        type: string
      date:
        type: string
        format: date
      amount:
        type: number
        format: float
      type:
        type: string
      description:
        type: string
      category:
        type: string
      notes:
        type: string

  TransactionUpdate:
    type: object
    properties:
      description:
        type: string
      category:
        type: string
      notes:
        type: string

  TransactionInfo:
    type: object
    properties:
      category:
        type: string
      notes:
        type: string

securityDefinitions:
  Bearer:
    type: apiKey
    name: Authorization
    in: header
