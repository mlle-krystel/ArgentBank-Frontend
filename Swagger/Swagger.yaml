swagger: '2.0'
info:
  title: Bank Argent API documentation
  description: Contient tous les endpoints disponibles dans cette application
  version: '1.0.0'
  termsOfService: 'http://swagger.io/terms/'

host: localhost:3001
basePath: /api/v1
schemes:
  - http

paths:
  # Endpoint pour connecter un utilisateur (authentification par email/mot de passe)
  /user/login:
    post:
      tags:
        - User Module
      summary: Login
      description: API pour authentifier un utilisateur
      parameters:
        - in: body
          name: body
          description: Identifiants de connexion
          required: true
          schema:
            $ref: '#/definitions/Login'
      produces:
        - application/json
      responses:
        '200':
          description: Connexion réussie
          schema:
            $ref: '#/definitions/LoginResponse'
        '400':
          description: Champs invalides
        '500':
          description: Erreur serveur

  # Endpoint pour inscrire un nouvel utilisateur
  /user/signup:
    post:
      tags:
        - User Module
      summary: Signup
      description: API pour créer un compte utilisateur
      parameters:
        - in: body
          name: body
          description: Données d'inscription
          required: true
          schema:
            $ref: '#/definitions/User'
      produces:
        - application/json
      responses:
        '200':
          description: Inscription réussie
          schema:
            $ref: '#/definitions/ApiResponse'
        '400':
          description: Champs invalides
        '500':
          description: Erreur serveur

  # Endpoints pour gérer le profil utilisateur :
  /user/profile:
  # Get pour récupérer le profil utilisateur
    get:
      security:
        - Bearer: []
      tags:
        - User Module
      summary: Récupérer le profil utilisateur
      description: Récupère les infos du profil connecté
      produces:
        - application/json
      responses:
        '200':
          description: Profil récupéré
          schema:
            $ref: '#/definitions/ApiResponse'
        '400':
          description: Champs invalides
        '500':
          description: Erreur serveur
# Put pour mettre à jour le profil de l’utilisateur (le nom d’utilisateur)
    put:
      security:
        - Bearer: []
      tags:
        - User Module
      summary: Modifier le profil utilisateur
      description: Permet de modifier le nom d'utilisateur
      parameters:
        - in: body
          name: body
          description: Nouvel attribut userName
          required: true
          schema:
            $ref: '#/definitions/UserProfile'
      produces:
        - application/json
      responses:
        '200':
          description: Profil mis à jour
          schema:
            $ref: '#/definitions/ApiResponse'
        '400':
          description: Champs invalides
        '500':
          description: Erreur serveur

  # Endpoints pour les transactions d’un compte utilisateur
  /transactions/{accountId}:
  # Get pour récupérer les transactions du compte pour le mois en cours
    get:
      security:
        - Bearer: []
      tags:
        - Module Transaction
      summary: Récupérer les transactions du compte
      description: Retourne toutes les transactions du mois courant pour un compte utilisateur
      parameters:
        - name: accountId
          in: path
          required: true
          type: string
      produces:
        - application/json
      responses:
        '200':
          description: Transactions récupérées avec succès
          schema:
            type: array
            items:
              $ref: '#/definitions/Transaction'
        '400':
          description: Requête invalide
        '500':
          description: Erreur serveur

  # Endpoints pour une transaction spécifique
  /transactions/{accountId}/{transactionId}:
  # Get pour récupérer les détails d’une transaction spécifique
    get:
      security:
        - Bearer: []
      tags:
        - Module Transaction
      summary: Détails d'une transaction
      description: Retourne les détails d'une transaction spécifique
      parameters:
        - name: accountId
          in: path
          required: true
          type: string
        - name: transactionId
          in: path
          required: true
          type: string
      produces:
        - application/json
      responses:
        '200':
          description: Détails de la transaction
          schema:
            $ref: '#/definitions/Transaction'
        '400':
          description: Requête invalide
        '500':
          description: Erreur serveur
# Patch pour modifier la catégorie ou la note d’une transaction
    patch:
      security:
        - Bearer: []
      tags:
        - Module Transaction
      summary: Modifier catégorie ou note
      description: Permet de modifier les métadonnées de la transaction (catégorie ou note)
      parameters:
        - name: accountId
          in: path
          required: true
          type: string
        - name: transactionId
          in: path
          required: true
          type: string
        - name: body
          in: body
          required: true
          schema:
            type: object
            properties:
              category:
                type: string
              note:
                type: string
      produces:
        - application/json
      responses:
        '200':
          description: Transaction modifiée
        '400':
          description: Requête invalide
        '500':
          description: Erreur serveur
# Delete pour supprimer la catégorie ou la note d’une transaction
    delete:
      security:
        - Bearer: []
      tags:
        - Module Transaction
      summary: Supprimer catégorie ou note
      description: Supprime les métadonnées d'une transaction (pas la transaction)
      parameters:
        - name: accountId
          in: path
          required: true
          type: string
        - name: transactionId
          in: path
          required: true
          type: string
      produces:
        - application/json
      responses:
        '204':
          description: Métadonnées supprimées
        '400':
          description: ID invalide
        '500':
          description: Erreur serveur
# Modeles de sécurité pour l'authentification par token Bearer
securityDefinitions:
  Bearer:
    type: apiKey
    name: Authorization
    in: header
# Modèles de données utilisés dans l'API
definitions:
  User:
    type: object
    properties:
      email:
        type: string
        description: Email utilisateur
      password:
        type: string
        description: Mot de passe utilisateur
      firstName:
        type: string
        description: Prénom
      lastName:
        type: string
        description: Nom
      userName:
        type: string
        description: Nom d'utilisateur public
# Modèle pour les données de connexion
  Login:
    type: object
    properties:
      email:
        type: string
      password:
        type: string
# Modèle général de réponse API
  ApiResponse:
    type: object
    properties:
      status:
        type: integer
      message:
        type: string
      body:
        type: object
        properties:
          id:
            type: string
          email:
            type: string
# Modèle pour l'utilisateur lors de la connexion
  LoginResponse:
    type: object
    properties:
      token:
        type: string
# Modèle pour la mise à jour du profil utilisateur
  UserProfile:
    type: object
    properties:
      userName:
        type: string
# Modèle pour une transaction bancaire
  Transaction:
    type: object
    properties:
      date:
        type: string
      description:
        type: string
      amount:
        type: number
      balance:
        type: number
      category:
        type: string
      note:
        type: string
